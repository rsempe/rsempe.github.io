name: Update availability

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check secrets are configured
        env:
          BOOKING_ICAL_VILLA_URL: ${{ secrets.BOOKING_ICAL_VILLA_URL }}
          BOOKING_ICAL_CABANON_URL: ${{ secrets.BOOKING_ICAL_CABANON_URL }}
          BOOKING_ICAL_ROSERAIE_URL: ${{ secrets.BOOKING_ICAL_ROSERAIE_URL }}
        run: |
          # Fail fast if the iCal secrets are missing: running without them
          # would publish empty calendars over the real availability data.
          if [ -z "$BOOKING_ICAL_VILLA_URL" ] || [ -z "$BOOKING_ICAL_CABANON_URL" ] || [ -z "$BOOKING_ICAL_ROSERAIE_URL" ]; then
            echo "::error::Missing BOOKING_ICAL_*_URL repository secrets — aborting to avoid wiping availability data."
            exit 1
          fi

      - name: Generate public availability
        env:
          BOOKING_ICAL_VILLA_URL: ${{ secrets.BOOKING_ICAL_VILLA_URL }}
          BOOKING_ICAL_CABANON_URL: ${{ secrets.BOOKING_ICAL_CABANON_URL }}
          BOOKING_ICAL_ROSERAIE_URL: ${{ secrets.BOOKING_ICAL_ROSERAIE_URL }}
        run: node scripts/generate-availability.js

      - name: Commit availability update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update booking availability"
          file_pattern: assets/data/availability.json
